<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Human Firewall Lite</title>
<meta name="description" content="Admin login for Human Firewall Lite SOC Dashboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ── Reset & Base ─────────────────────────────────────── */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-deep:     #060a13;
    --bg-base:     #0b1120;
    --bg-surface:  #111a2e;
    --bg-elevated: #162036;
    --border:      rgba(99, 102, 241, 0.12);
    --border-hover:rgba(99, 102, 241, 0.3);
    --accent:      #818cf8;
    --accent-dim:  #6366f1;
    --text-primary:#f1f5f9;
    --text-secondary:#94a3b8;
    --text-muted:  #475569;
    --success:     #34d399;
    --warning:     #fbbf24;
    --danger:      #f87171;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Ambient Background (same as dashboard) ────────────── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 10% 20%, rgba(99,102,241,0.06), transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 80%, rgba(52,211,153,0.04), transparent 50%),
      radial-gradient(ellipse 70% 40% at 50% 0%,  rgba(96,165,250,0.04), transparent 50%);
    pointer-events: none;
  }

  /* ── Floating particles (subtle depth) ─────────────────── */
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(129,140,248,0.15), transparent),
      radial-gradient(1px 1px at 80% 20%, rgba(129,140,248,0.1), transparent),
      radial-gradient(1px 1px at 40% 70%, rgba(99,102,241,0.1), transparent),
      radial-gradient(1px 1px at 70% 60%, rgba(129,140,248,0.08), transparent),
      radial-gradient(1.5px 1.5px at 55% 15%, rgba(96,165,250,0.12), transparent);
    pointer-events: none;
    animation: drift 20s ease-in-out infinite alternate;
  }

  @keyframes drift {
    0%   { transform: translateY(0) translateX(0); }
    100% { transform: translateY(-20px) translateX(10px); }
  }

  /* ── Fade-in animation ─────────────────────────────────── */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes shimmer {
    0%   { background-position: -200% center; }
    100% { background-position: 200% center; }
  }

  /* ── Login Card (glassmorphism) ─────────────────────────── */
  .login-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    margin: 24px;
    padding: 48px 40px 40px;
    background: rgba(17, 26, 46, 0.6);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow:
      0 0 0 1px rgba(99,102,241,0.05),
      0 8px 40px rgba(0,0,0,0.4),
      0 0 80px rgba(99,102,241,0.06);
    animation: fadeInUp 0.7s ease-out both;
  }

  /* subtle top-edge glow */
  .login-card::before {
    content: '';
    position: absolute;
    top: -1px; left: 40px; right: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
    border-radius: 1px;
  }

  /* ── Logo ───────────────────────────────────────────────── */
  .login-logo {
    width: 56px; height: 56px;
    margin: 0 auto 24px;
    background: linear-gradient(135deg, var(--accent-dim), var(--accent));
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 30px rgba(99,102,241,0.3);
    animation: fadeIn 0.8s ease-out 0.2s both;
  }

  .login-logo svg {
    width: 28px; height: 28px;
  }

  /* ── Titles ─────────────────────────────────────────────── */
  .login-title {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.4px;
    margin-bottom: 6px;
    background: linear-gradient(135deg, var(--text-primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: fadeIn 0.8s ease-out 0.3s both;
  }

  .login-subtitle {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-secondary);
    text-align: center;
    margin-bottom: 36px;
    letter-spacing: 0.5px;
    animation: fadeIn 0.8s ease-out 0.4s both;
  }

  /* ── Form ───────────────────────────────────────────────── */
  .login-form {
    animation: fadeIn 0.8s ease-out 0.5s both;
  }

  .form-group {
    margin-bottom: 24px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }

  .form-input {
    width: 100%;
    padding: 14px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--text-primary);
    background: rgba(6, 10, 19, 0.6);
    border: 1px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: all 0.25s ease;
  }

  .form-input::placeholder {
    color: var(--text-muted);
  }

  .form-input:hover {
    border-color: var(--border-hover);
  }

  .form-input:focus {
    border-color: var(--accent);
    box-shadow:
      0 0 0 3px rgba(99,102,241,0.12),
      0 0 20px rgba(99,102,241,0.08);
  }

  /* ── Submit Button ──────────────────────────────────────── */
  .btn-submit {
    width: 100%;
    padding: 14px 24px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: #fff;
    background: linear-gradient(135deg, var(--accent-dim), var(--accent));
    border: none;
    border-radius: 12px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.25s ease;
  }

  .btn-submit::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255,255,255,0.08) 50%,
      transparent 100%
    );
    background-size: 200% 100%;
    animation: shimmer 3s ease-in-out infinite;
    pointer-events: none;
  }

  .btn-submit:hover {
    transform: translateY(-1px);
    box-shadow:
      0 4px 20px rgba(99,102,241,0.35),
      0 0 40px rgba(99,102,241,0.15);
  }

  .btn-submit:active {
    transform: translateY(0);
    box-shadow: 0 2px 8px rgba(99,102,241,0.25);
  }

  /* ── Error Alert ────────────────────────────────────────── */
  .error-alert {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    margin-bottom: 24px;
    background: rgba(248, 113, 113, 0.08);
    border: 1px solid rgba(248, 113, 113, 0.2);
    border-radius: 12px;
    font-size: 13px;
    color: var(--danger);
    animation: fadeIn 0.4s ease-out both;
  }

  .error-alert svg {
    flex-shrink: 0;
    width: 18px; height: 18px;
  }

  /* ── Footer ─────────────────────────────────────────────── */
  .login-footer {
    margin-top: 32px;
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.3px;
    animation: fadeIn 0.8s ease-out 0.6s both;
  }

  /* ── Responsive ─────────────────────────────────────────── */
  @media (max-width: 480px) {
    .login-card {
      padding: 36px 24px 28px;
      border-radius: 20px;
    }
    .login-title { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="login-card">
  <!-- Shield Logo -->
  <div class="login-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
  </div>

  <!-- Titles -->
  <h1 class="login-title">Human Firewall Lite</h1>
  <p class="login-subtitle">SOC Dashboard Access</p>

  <!-- Error Alert (Jinja2 conditional) -->
  {% if error %}
  <div class="error-alert">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="15" y1="9" x2="9" y2="15"/>
      <line x1="9" y1="9" x2="15" y2="15"/>
    </svg>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <!-- Login Form -->
  <form class="login-form" method="POST" action="/admin/login">
    <div class="form-group">
      <label class="form-label" for="password">Admin Password</label>
      <input
        class="form-input"
        type="password"
        id="password"
        name="password"
        placeholder="Enter dashboard password"
        autocomplete="current-password"
        required
        autofocus
      >
    </div>
    <button class="btn-submit" type="submit">
      Authenticate &amp; Enter
    </button>
  </form>

  <!-- Footer -->
  <div class="login-footer">
    Authorized personnel only &middot; Human Firewall Lite v1.0
  </div>
</div>

</body>
</html>
